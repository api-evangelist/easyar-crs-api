name: EasyAR CRS API
description: EasyAR CRS (Cloud Recognition Service) is a cloud image-recognition solution that lets developers manage
  up to 100K image-targets online and recognize them from camera key-frames. It provides HTTP web-service APIs for
  target management and recognition, with request-signing/token authentication on per-instance regional base URLs.
